<!DOCTYPE html>
<html>
<head>
    <title>Live Monitor Ultra</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .ui { position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; background: rgba(0,0,0,0.5); padding: 5px; }
    </style>
</head>
<body>
    <div class="ui">FPS Estimado: <span id="fps">0</span></div>
    <img id="live-img" src="">

    <script>
        const url = "https://hack-3efea-default-rtdb.europe-west1.firebasedatabase.app/monitoramento.json";
        const imgElement = document.getElementById('live-img');
        let lastTime = Date.now();

        async function updateFrame() {
            try {
                // Adicionamos um timestamp para evitar cache do navegador
                const response = await fetch(url + '?nocache=' + Date.now());
                const data = await response.json();

                if (data && data.img) {
                    imgElement.src = "data:image/jpeg;base64," + data.img;
                    
                    // Cálculo de performance
                    let now = Date.now();
                    let fps = Math.round(1000 / (now - lastTime));
                    document.getElementById('fps').innerText = fps;
                    lastTime = now;
                }
            } catch (e) {
                console.error("Erro na busca:", e);
            }
            
            // Chama a próxima atualização assim que a imagem atual carregar
            requestAnimationFrame(updateFrame);
        }

        updateFrame();
    </script>
</body>
</html>
