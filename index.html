<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca do Ridelvan</title>
    <style>
        body {
            background-color: #ffffff; /* Tema Branco */
            color: #222;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 5%;
        }

        h1 {
            text-align: left;
            font-size: 32px;
            font-weight: bold;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        /* Grade que organiza tudo sozinho */
        .estante {
            display: grid;
            /* Define o tamanho das capas (220px). Se quiser maior, aumente aqui */
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 50px 30px;
            justify-items: center;
        }

        .livro {
            width: 220px; /* Largura fixa para manter a proporção */
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s;
        }

        /* Moldura para deixar todas as capas do mesmo tamanho */
        .capa-moldura {
            width: 100%;
            height: 320px; /* Altura fixa para alinhar os livros lado a lado */
            background-color: #f0f0f0;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .capa-moldura img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Faz a imagem preencher a moldura sem deformar */
        }

        .info {
            margin-top: 15px;
            text-align: left;
        }

        .titulo {
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .autor {
            font-size: 14px;
            color: #666;
        }

        /* Efeito de toque para o iPad */
        .livro:active {
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <h1>Biblioteca do Ridelvan</h1>

    <div class="estante">

        <!-- LIVRO 1: VIDA PARA CONSUMO -->
        <a href="livro1.pdf.pdf" class="livro">
            <div class="capa-moldura">
                <img src="capa1.jpg.png" alt="Capa Vida para Consumo">
            </div>
            <div class="info">
                <span class="titulo">Vida para Consumo</span>
                <span class="autor">Zygmunt Bauman</span>
            </div>
        </a>

        <!-- LIVRO 2: HISTÓRIA DO BRASIL -->
        <a href="livro2.pdf.pdf" class="livro">
            <div class="capa-moldura">
                <img src="capa2.jpg.png" alt="Capa História do Brasil">
            </div>
            <div class="info">
                <span class="titulo">A História do Brasil</span>
                <span class="autor">Marcos Costa</span>
            </div>
        </a>

        <!-- QUANDO QUISER ADICIONAR MAIS, COPIE DO <a href...> ATÉ </a> E COLE ABAIXO -->

    </div>

</body>
</html>
