<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca do Ridelvan</title>
    <style>
        /* Estilos básicos para o iPad 2 */
        body {
            background-color: #ffffff;
            color: #333;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 30px;
            text-align: left;
        }

        /* Container que organiza os livros em grade */
        .biblioteca-container {
            display: block;
            text-align: center;
        }

        /* Cada bloco de livro */
        .livro-item {
            display: inline-block; /* Faz os livros ficarem lado a lado */
            vertical-align: top;
            width: 180px; /* Largura ideal para caber vários na tela */
            margin: 15px;
            text-align: left;
            text-decoration: none;
            color: inherit;
        }

        /* A moldura da capa (Sempre na Vertical) */
        .capa-box {
            width: 180px;
            height: 260px; /* Altura maior que a largura = Vertical */
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 3px 5px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 10px;
        }

        .capa-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta a imagem sem esticar */
        }

        .titulo {
            font-size: 16px;
            font-weight: bold;
            display: block;
            line-height: 1.2;
        }

        .autor {
            font-size: 13px;
            color: #777;
            display: block;
            margin-top: 3px;
        }

        /* Feedback ao tocar no iPad */
        .livro-item:active {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <h1>Biblioteca do Ridelvan</h1>

    <div class="biblioteca-container">

        <!-- LIVRO 1 -->
        <a href="livro1.pdf.pdf" class="livro-item">
            <div class="capa-box">
                <img src="capa1.jpg.png" alt="Capa">
            </div>
            <span class="titulo">Vida para Consumo</span>
            <span class="autor">Zygmunt Bauman</span>
        </a>

        <!-- LIVRO 2 -->
        <a href="livro2.pdf.pdf" class="livro-item">
            <div class="capa-box">
                <img src="capa2.jpg.png" alt="Capa">
            </div>
            <span class="titulo">A História do Brasil</span>
            <span class="autor">Marcos Costa</span>
        </a>

        <!-- PARA ADICIONAR MAIS: 
             Basta copiar o bloco de um livro e colar aqui embaixo, 
             mudando o link do PDF e o nome da imagem da capa. -->

    </div>

</body>
</html>
