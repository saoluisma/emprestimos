<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca do Ridelvan</title>
    <style>
        body {
            background-color: #ffffff;
            color: #333;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: bold;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 30px;
            text-align: left;
        }

        /* Grade que organiza os livros */
        .container-estante {
            text-align: center; /* Centraliza a grade no iPad */
        }

        .livro-slot {
            display: inline-block;
            vertical-align: top;
            width: 160px; /* Tamanho médio ideal para o iPad 2 */
            margin: 15px 10px;
            text-align: left;
            text-decoration: none;
            color: inherit;
        }

        /* Moldura da Capa - Formato Vertical */
        .capa-moldura {
            width: 160px;
            height: 230px; 
            background-color: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 10px;
        }

        .capa-moldura img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta a imagem sem distorcer */
        }

        .titulo {
            font-size: 15px;
            font-weight: bold;
            display: block;
            line-height: 1.2;
            height: 36px; /* Garante alinhamento mesmo com títulos longos */
            overflow: hidden;
        }

        .autor {
            font-size: 12px;
            color: #888;
            display: block;
        }

        /* Efeito de clique */
        .livro-slot:active {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <h1>Biblioteca do Ridelvan</h1>

    <div class="container-estante">

        <!-- LIVRO 1 -->
        <a href="livro1.pdf.pdf" class="livro-slot">
            <div class="capa-moldura">
                <img src="img/capa1.png" alt="Capa 1">
            </div>
            <span class="titulo">Vida para Consumo</span>
            <span class="autor">Zygmunt Bauman</span>
        </a>

        <!-- LIVRO 2 -->
        <a href="livro2.pdf.pdf" class="livro-slot">
            <div class="capa-moldura">
                <img src="img/capa2.png" alt="Capa 2">
            </div>
            <span class="titulo">A História do Brasil</span>
            <span class="autor">Marcos Costa</span>
        </a>

        <!-- LIVRO 3 (Vazio - só mudar os nomes abaixo) -->
        <a href="livro3.pdf" class="livro-slot">
            <div class="capa-moldura">
                <img src="img/capa3.png" alt="Adicionar Livro">
            </div>
            <span class="titulo">Nome do Livro 3</span>
            <span class="autor">Autor 3</span>
        </a>

        <!-- LIVRO 4 (Vazio) -->
        <a href="livro4.pdf" class="livro-slot">
            <div class="capa-moldura">
                <img src="img/capa4.png" alt="Adicionar Livro">
            </div>
            <span class="titulo">Nome do Livro 4</span>
            <span class="autor">Autor 4</span>
        </a>

        <!-- LIVRO 5 (Vazio) -->
        <a href="livro5.pdf" class="livro-slot">
            <div class="capa-moldura">
                <img src="img/capa5.png" alt="Adicionar Livro">
            </div>
            <span class="titulo">Nome do Livro 5</span>
            <span class="autor">Autor 5</span>
        </a>

        <!-- LIVRO 6 (Vazio) -->
        <a href="livro6.pdf" class="livro-slot">
            <div class="capa-moldura">
                <img src="img/capa6.png" alt="Adicionar Livro">
            </div>
            <span class="titulo">Nome do Livro 6</span>
            <span class="autor">Autor 6</span>
        </a>

    </div>

</body>
</html>
