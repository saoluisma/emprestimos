<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca do Ridelvan</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-weight: 300;
            margin-bottom: 40px;
            color: #000;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }
        .livro {
            width: 180px;
            transition: transform 0.2s;
        }
        .livro img {
            width: 100%;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        .livro p {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        /* Otimização para toque no iPad */
        .livro:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Biblioteca do Ridelvan</h1>

    <div class="grid">
        <!-- Livro 1 -->
        <a href="livro1.pdf.pdf" class="livro">
            <img src="capa1.jpg.jpg" alt="Vida para Consumo">
            <p>Vida para Consumo<br><small>Zygmunt Bauman</small></p>
        </a>

        <!-- Livro 2 -->
        <a href="livro2.pdf.pdf" class="livro">
            <img src="capa2.jpg.jpg" alt="História do Brasil">
            <p>História do Brasil<br><small>Marcos Costa</small></p>
        </a>
    </div>

</body>
</html>
